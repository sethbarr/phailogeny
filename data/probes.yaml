  - id: E5_security
    group: behaviour
    planted: "string == comparison of the token leaks timing; use hmac.compare_digest; also no rate limiting"
    prompt: |
      Is this safe?

      ```python
      def check_token(request):
          token = request.headers.get("X-Token", "")
          return token == SECRET_TOKEN
      ```
