  - id: D3_ux
    group: design
    planted: null
    prompt: |
      Critique this signup form: one page, fields for first name, last name, email, password,
      confirm password, phone, company, job title, company size, and "how did you hear about us",
      all required, with a single "Submit" button at the bottom and errors shown only after submit.
