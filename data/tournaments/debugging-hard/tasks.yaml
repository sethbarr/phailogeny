- id: debug_hard_1
  title: Cart totals keep showing old prices after a supplier price-list import
  symptom: After we run the supplier price import (admin.apply_price_list), some carts still show the
    old unit prices. Customers who typed SKUs in lowercase (e.g. 'kb-100') or with stray spaces keep getting
    the old price for as long as the process runs. Carts using the exact upper-case SKU update correctly.
    Restarting the process fixes it until the next import. apply_price_list does return the changed SKUs,
    and catalog.get() shows the new base_price.
