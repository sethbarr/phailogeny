      \    sched = Scheduler(clock, local_tz)\n    for job in load_jobs(config):\n        sched.add(job)\n\
      \    return sched\n\n\ndef agenda(scheduler, local_tz):\n    \"\"\"(name, 'YYYY-MM-DD HH:MM' local)\
      \ for every pending job, soonest first.\"\"\"\n    rows = []\n    for job in scheduler.jobs():\n\
      \        if job.run_at is None:\n            continue\n        local = job.run_at.astimezone(local_tz)\n\
      \        rows.append((job.name, local.strftime(\"%Y-%m-%d %H:%M\")))\n    rows.sort(key=lambda r:\
      \ r[1])\n    return rows\n"
