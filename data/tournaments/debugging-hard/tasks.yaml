      \"\"\n    return sku.strip().upper()\n\n\n@dataclass\nclass Product:\n    sku: str\n    name: str\n\
      \    base_price: float\n    category: str = \"general\"\n\n\nclass Catalog:\n    def __init__(self):\n\
      \        self._products = {}\n        self._listeners = []\n\n    def subscribe(self, callback):\n\
      \        \"\"\"Register callback(sku) invoked whenever a product changes.\"\"\"\n        self._listeners.append(callback)\n\
      \n    def _notify(self, sku):\n        for callback in list(self._listeners):\n            callback(sku)\n\
      \n    def add(self, sku, name, base_price, category=\"general\"):\n        key = normalize_sku(sku)\n\
      \        self._products[key] = Product(key, name, float(base_price), category)\n        self._notify(key)\n\
      \n    def get(self, sku):\n        key = normalize_sku(sku)\n        try:\n            return self._products[key]\n\
      \        except KeyError:\n            raise KeyError(f\"unknown sku: {sku!r}\") from None\n\n \
      \   def update_price(self, sku, new_price):\n        product = self.get(sku)\n        if new_price\
      \ < 0:\n            raise ValueError(\"price must be non-negative\")\n        product.base_price\
      \ = float(new_price)\n        self._notify(product.sku)\n"
