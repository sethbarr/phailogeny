  symptom: Values in the INI config file don't take effect. With `[server] port = 9000` in app.ini and
    no APP_* environment variables set, load_settings() still returns port 8000. The same happens to `[logging]
    level` and `[database] pool_size`. Custom sections in the file (for example `[features] beta = on`)
    do appear in the result. Setting an environment variable such as APP_SERVER_PORT=9100 works. The docstring
    promises defaults < file < environment, and the merge loop in settings.py goes in that order.
