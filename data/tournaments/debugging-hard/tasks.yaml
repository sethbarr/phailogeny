- id: debug_hard_2
  title: Jobs scheduled with UTC/offset timestamps fire hours early or late
  symptom: Jobs whose 'at' time in the config has an explicit offset (e.g. '2026-03-01T12:00:00Z' or '...T14:00:00+02:00')
    run at the wrong time. On our US-East box (UTC-5) they run 5 hours late, and the agenda shows '12:00'
    for a 12:00Z job when it should show '07:00' local. On a Tokyo deployment the same jobs run 9 hours
    early. Jobs written without an offset ('2026-03-01 07:15') run on time everywhere. No exceptions are
    raised.
  files:
  - path: timeparse.py
    content: "\"\"\"Parsing of timestamps and durations found in job configuration.\"\"\"\nfrom datetime\
      \ import datetime, timedelta, timezone\n\n_UNITS = {\"s\": \"seconds\", \"m\": \"minutes\", \"h\"\
      : \"hours\", \"d\": \"days\"}\n\n\ndef parse_timestamp(text):\n    \"\"\"Parse an ISO-8601 timestamp.\n\
      \n    Timestamps with an explicit offset (or 'Z') identify an absolute\n    instant. Timestamps\
      \ without an offset are wall-clock times in the\n    scheduler's local zone.\n    \"\"\"\n    s\
      \ = text.strip()\n    if not s:\n        raise ValueError(\"empty timestamp\")\n    if s.endswith((\"\
      Z\", \"z\")):\n        # fromisoformat() before Python 3.11 rejects a trailing 'Z'\n        s =\
      \ s[:-1] + \"+00:00\"\n    s = s.replace(\" \", \"T\", 1)\n    try:\n        value = datetime.fromisoformat(s)\n\
      \    except ValueError:\n        raise ValueError(f\"bad timestamp: {text!r}\") from None\n    if\
      \ value.tzinfo is not None:\n        # normalise everything to UTC\n        value = value.astimezone(timezone.utc).replace(tzinfo=None)\n\
      \    return value\n\n\ndef parse_duration(text):\n    \"\"\"Parse '90s', '15m', '2h', '1d' into\
      \ a timedelta.\"\"\"\n    s = text.strip().lower()\n    if len(s) < 2 or s[-1] not in _UNITS or\
      \ not s[:-1].isdigit():\n        raise ValueError(f\"bad duration: {text!r}\")\n    amount = int(s[:-1])\n\
      \    if amount <= 0:\n        raise ValueError(\"duration must be positive\")\n    return timedelta(**{_UNITS[s[-1]]:\
      \ amount})\n"
  - path: jobs.py
    content: "\"\"\"Job definitions loaded from configuration dictionaries.\"\"\"\nfrom dataclasses import\
      \ dataclass\nfrom datetime import datetime, timedelta\nfrom typing import Optional\n\nfrom timeparse\
      \ import parse_duration, parse_timestamp\n\n\n@dataclass\nclass Job:\n    name: str\n    run_at:\
      \ Optional[datetime]\n    repeat: Optional[timedelta] = None\n    runs: int = 0\n\n\ndef load_jobs(config):\n\
      \    jobs = []\n    seen = set()\n    for entry in config:\n        name = entry[\"name\"]\n   \
      \     if name in seen:\n            raise ValueError(f\"duplicate job name: {name}\")\n        seen.add(name)\n\
      \        run_at = parse_timestamp(entry[\"at\"])\n        every = entry.get(\"every\")\n       \
      \ repeat = parse_duration(every) if every else None\n        jobs.append(Job(name, run_at, repeat))\n\
      \    return jobs\n"
  - path: scheduler.py
    content: "\"\"\"In-process job scheduler driven by an injectable clock.\"\"\"\n\n\nclass Scheduler:\n\
      \    def __init__(self, clock, local_tz):\n        \"\"\"clock() must return a timezone-aware datetime.\"\
      \"\"\n        self._clock = clock\n        self._local_tz = local_tz\n        self._jobs = []\n\n\
      \    def _as_aware(self, dt):\n        # Naive config times are wall-clock times in the local zone.\n\
      \        if dt.tzinfo is None:\n            return dt.replace(tzinfo=self._local_tz)\n        return\
      \ dt\n\n    def add(self, job):\n        if job.run_at is not None:\n            job.run_at = self._as_aware(job.run_at)\n\
      \        self._jobs.append(job)\n\n    def jobs(self):\n        return list(self._jobs)\n\n    def\
      \ next_run(self):\n        pending = [j.run_at for j in self._jobs if j.run_at is not None]\n  \
      \      return min(pending) if pending else None\n\n    def run_pending(self, handler):\n       \
      \ now = self._clock()\n        due = [j for j in self._jobs if j.run_at is not None and j.run_at\
      \ <= now]\n        fired = []\n        for job in sorted(due, key=lambda j: (j.run_at, j.name)):\n\
      \            handler(job)\n            job.runs += 1\n            fired.append(job.name)\n     \
      \       if job.repeat:\n                # skip missed occurrences rather than replaying a backlog\n\
      \                while job.run_at <= now:\n                    job.run_at += job.repeat\n      \
      \      else:\n                job.run_at = None\n        return fired\n"
  - path: app.py
    content: "\"\"\"Wiring: build a scheduler from config and render an agenda.\"\"\"\nfrom jobs import\
