      \ {\n    \"currency\": \"USD\",\n    \"precision\": 2,\n    \"format\": {\n        \"delimiter\"\
      : \",\",\n        \"decimal_sep\": \".\",\n        \"thousands_sep\": \"\",\n    },\n    \"columns\"\
      : (\"sku\", \"qty\", \"amount\"),\n}\n\n# Keys whose values are dicts and should be merged rather\
      \ than replaced.\n_NESTED_KEYS = (\"format\",)\n\n\ndef load_options(overrides=None):\n    \"\"\"\
      Return a fresh options dict with ``overrides`` applied on top of defaults.\"\"\"\n    options =\
      \ dict(DEFAULT_OPTIONS)\n    if not overrides:\n        return options\n    for key, value in overrides.items():\n\
      \        if key in _NESTED_KEYS:\n            options[key].update(value)\n        else:\n      \
      \      options[key] = value\n    return options\n"
