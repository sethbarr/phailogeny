  red_herring: 'formatting.py keeps a module-level mutable `_HEADER_CACHE` dict that persists across calls.
    That fits the ''shared state'' pattern and looks like it could serve a stale `sku;qty;amount` header
    to the exporter. It is correct, though: the cache key includes the delimiter, so each delimiter gets
    its own header. The real leak is upstream, in what delimiter the exporter is given. A second distraction
    is that parse_csv hard-codes '','', which looks like the bug when you read the KeyError traceback.'
  root_cause: settings.load_options makes only a shallow copy of DEFAULT_OPTIONS, so applying a 'format'
    override in report.render_summary calls .update() on the shared nested defaults dict. That permanently
    changes the delimiter and separators that exporter.export_csv later reads through load_options().
