  red_herring: 'The merge loop in settings.py (`result = deep_merge(result, layer)` over [defaults, file,
    env]) and the shallow `dict(base)` copy in merge.deep_merge both look like the cause: the first looks
    like the precedence is backwards, the second like it could alias or mutate DEFAULTS. Both are correct.
    The order really is defaults < file < env, and settings deep-copies DEFAULTS first, so nothing is
    aliased. Swapping the layer order would make the file override the environment.'
  root_cause: loader.load_env uses `environ.get(name, default)` and so returns a complete layer with every
