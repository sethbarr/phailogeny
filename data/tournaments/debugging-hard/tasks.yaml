- id: debug_hard_7
  title: Revoked catalog credentials produce stale quotes instead of an auth error
  symptom: After the catalog API token was revoked, QuoteService.quote() did not raise AuthError, even
    though service.py has an explicit `except PermissionError` branch for that case. If a price had been
    cached earlier, it returned a Quote with stale=True and the old price. If not, it raised ServiceUnavailable('catalog
    unavailable ...'). The transport log shows three identical requests to /prices/<sku> for every quote,
    with backoff between them. Real outages (503/504) still behave correctly.
  files:
  - path: transport.py
    content: "\"\"\"In-memory HTTP-ish transport used by the catalog client.\n\nHTTP status codes are\
      \ mapped onto built-in exceptions so callers never\nhave to inspect raw status codes:\n\n    401/403\
      \ -> PermissionError\n    404     -> KeyError\n    429/503 -> ConnectionError\n    504     -> TimeoutError\n\
      \"\"\"\n\n_STATUS_ERRORS = {\n    401: PermissionError,\n    403: PermissionError,\n    429: ConnectionError,\n\
      \    503: ConnectionError,\n    504: TimeoutError,\n}\n\n\nclass ScriptedTransport:\n    \"\"\"\
      Replays a fixed script of (status, body) responses per path.\n\n    Responses are consumed in order;\
      \ the final response for a path is\n    sticky and is returned for every subsequent call.\n    \"\
      \"\"\n\n    def __init__(self, script):\n        self._script = {path: list(responses) for path,\
      \ responses in script.items()}\n        self.calls = []\n\n    def get(self, path):\n        self.calls.append(path)\n\
      \        queue = self._script.get(path)\n        if not queue:\n            raise KeyError(path)\n\
      \        status, body = queue.pop(0) if len(queue) > 1 else queue[0]\n        if status == 200:\n\
      \            return body\n        if status == 404:\n            raise KeyError(path)\n        exc_type\
      \ = _STATUS_ERRORS.get(status)\n        if exc_type is None:\n            raise RuntimeError(f\"\
      unexpected status {status} for {path}\")\n        raise exc_type(f\"HTTP {status} for {path}\")\n"
  - path: retry.py
    content: "\"\"\"Generic retry decorator with exponential backoff.\"\"\"\nimport functools\nimport\
      \ time\n\n\nclass RetryExhausted(Exception):\n    \"\"\"Raised when every attempt failed with a\
      \ retryable error.\"\"\"\n\n    def __init__(self, func_name, attempts, last_error):\n        super().__init__(f\"\
      {func_name} failed after {attempts} attempts: {last_error!r}\")\n        self.attempts = attempts\n\
      \        self.last_error = last_error\n\n\ndef retry(on, attempts=3, base_delay=0.1, sleeper=time.sleep):\n\
      \    \"\"\"Retry the wrapped callable when it raises one of the `on` exceptions.\n\n    Non-matching\
      \ exceptions propagate immediately and unchanged.\n    \"\"\"\n    if attempts < 1:\n        raise\
      \ ValueError(\"attempts must be >= 1\")\n\n    def decorate(fn):\n        @functools.wraps(fn)\n\
      \        def wrapper(*args, **kwargs):\n            for attempt in range(1, attempts + 1):\n   \
      \             try:\n                    return fn(*args, **kwargs)\n                except on as\
      \ exc:\n                    if attempt == attempts:\n                        raise RetryExhausted(fn.__name__,\
