- id: debug_hard_5
  title: CSV export breaks after a localized summary report is rendered in the same process
  symptom: 'The warehouse importer intermittently fails with KeyError: ''sku'' when it parses our CSV
    exports. When it fails, the export starts with `sku;qty;amount` and amounts look like `1.234,50`,
    even though export_csv() never asks for a locale. Running export_csv() alone in a fresh interpreter
    always gives a correct comma-separated file. It only goes wrong in long-running workers that also
    render customer summaries. Separately, a French-locale summary rendered after a German one comes out
    with semicolons.'
  files:
