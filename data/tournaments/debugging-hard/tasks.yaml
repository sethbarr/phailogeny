  red_herring: 'In admin.apply_price_list, `if product.base_price != price:` compares floats exactly and
    skips ''unchanged'' rows, so it looks like it could silently drop updates. It''s correct: both values
    come from float() of the same decimal text (or the earlier stored float), and skipping rows that really
    are unchanged is intended. The changed SKUs come back as expected and the catalog holds the new price.
    Also, PriceCache''s ttl=None (''never expires'') looks like the obvious culprit. But adding a TTL
    only hides the stale-price window. It doesn''t fix the missed invalidation.'
  root_cause: PriceCache stores entries under the raw SKU string the caller passed, but Catalog sends
    change notifications with the normalized (trimmed, upper-case) SKU, so invalidate() never removes
    entries cached under any other spelling.
