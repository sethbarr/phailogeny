    \ = samples\n\n    def record(self, ms):\n        if ms < 0:\n            raise ValueError(\"latency\
    \ cannot be negative\")\n        self.samples.append(ms)\n\n    def count(self):\n        return len(self.samples)\n\
    \n    def mean(self):\n        if not self.samples:\n            return 0.0\n        return sum(self.samples)\
    \ / len(self.samples)\n\n    def percentile(self, p):\n        if not self.samples:\n            return\
    \ 0.0\n        ordered = sorted(self.samples)\n        rank = max(1, math.ceil(p / 100 * len(ordered)))\n\
    \        return ordered[rank - 1]\n\n\ndef build_trackers(endpoints):\n    return {ep: LatencyTracker(ep)\
