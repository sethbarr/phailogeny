    def line_total(unit_price, qty, discount_pct=0):\n    \"\"\"Price one invoice line, rounding half-up\
    \ to the cent.\"\"\"\n    if qty < 0:\n        raise ValueError(\"qty must be non-negative\")\n  \
    \  gross = Decimal(unit_price) * qty\n    discount = gross * Decimal(str(discount_pct)) / Decimal(100)\n\
    \    return (gross - discount).quantize(CENT, rounding=ROUND_HALF_UP)\n\n\ndef invoice_total(lines):\n\
    \    total = Decimal(\"0.00\")\n    for line in lines:\n        total += line_total(*line)\n    return\
