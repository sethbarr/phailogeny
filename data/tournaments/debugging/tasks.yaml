- id: prevention_monitoring_4
  type: rubric
  title: Prevention plan after expired internal mTLS certificate outage
  prompt: 'Postmortem input. We need a prevention and monitoring plan, not just a root cause.


    Incident summary (2026-09-28): From 02:14 to 03:41 UTC, every request through api-gateway to auth-svc
    failed, so all logins and token refreshes broke. Root cause: the mTLS serving certificate for auth-svc
    (issued by cert-manager via Let''s Encrypt using a DNS-01 challenge on Route53) expired at 02:14.


    What we found:

    ```

    # api-gateway logs

    2026-09-28T02:14:03Z ERROR upstream=auth-svc tls: failed to verify certificate: x509: certificate
    has expired or is not yet valid: current time 2026-09-28T02:14:03Z is after 2026-09-28T02:14:00Z


    # cert-manager controller logs, first appearance 2026-08-29

    E0829 02:15:11 controller.go:167] cert-manager/challenges "msg"="error presenting challenge" "error"="route53:
    AccessDenied: User: arn:aws:sts::4412:assumed-role/cert-manager/... is not authorized to perform:
    route53:ChangeResourceRecordSets"

    (repeats every ~1h until incident)


    # kubectl get certificate -n auth

    NAME           READY   SECRET          AGE

    auth-svc-tls   False   auth-svc-tls    412d

    ```

    - On 2026-08-28 a Terraform PR "tighten IAM: least privilege for DNS roles" removed route53:ChangeResourceRecordSets
    from the cert-manager role.

    - cert-manager tries to renew 30 days before expiry. Renewal failed for 30 days straight with no alert.

    - We run Prometheus and Alertmanager. cert-manager metrics are scraped, but no alert rules use them.
    Blackbox exporter is deployed, but it only probes public endpoints.

    - 37 other Certificates in the cluster use the same ClusterIssuer.


    Write the prevention and monitoring section of the postmortem. Include concrete alert rules or queries
    with thresholds, runbook steps, and any safeguards that would have caught this before customers did.'
  buggy_code: ''
  test_code: ''
  reference_code: ''
  rubric:
  - Provides at least one concrete alert expression on certificate state from cert-manager metrics, e.g.
    certmanager_certificate_ready_status{condition="False"} == 1 or certmanager_certificate_expiration_timestamp_seconds
    - time() < N*86400. Thresholds must give days of lead time, not hours, and the window must be shorter
    than the 30-day renewal window so the alert fires while renewal is still failing.
  - Adds an independent, end-to-end expiry check on the cert actually served, e.g. extending blackbox
    exporter to probe internal auth-svc and alerting on probe_ssl_earliest_cert_expiry - time() < 14d.
    Explains this catches failures that cert-manager metrics would miss.
  - Addresses the IAM regression as its own preventive control, e.g. a policy or CI check, a test that
    asserts the cert-manager role keeps route53:ChangeResourceRecordSets, or a staging renewal/dry-run
    after IAM changes. Does not treat cert monitoring as the only fix.
  - 'Includes an actionable runbook: how to check Certificate/CertificateRequest/Challenge status, how
    to read the cert-manager error, how to restore permissions, and how to force renewal (e.g. cmctl renew).
    It also says to check the other 37 certificates on the shared ClusterIssuer.'
  - Mentions alerting on renewal or challenge errors themselves (e.g. a sustained rise in cert-manager
    ACME/challenge error metrics or log-based alert) so the 30-day silent failure would page or ticket
    within hours of starting, and assigns sensible severity/routing (ticket at early warning, page closer
    to expiry).
  expected_behaviour: ''
  variant_of: ''
  capability: prevention_monitoring
  validation:
    valid: true
    reasons: []
