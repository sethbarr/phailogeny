- id: hypothesis_testing_3
  type: verifiable
  title: Memoized currency conversion returns wrong currency (cache key ignores kwargs vs. suspected TTL/clock)
  prompt: "Production bug in our pricing helper. After anything calls `convert(100)`, a call to `convert(100,\
    \ currency=\"EUR\")` returns 100.0 instead of 92.0. This lasts about a minute and then fixes itself.\
    \ Positional calls like `convert(100, \"EUR\")` look fine. The on-call engineer thinks `time.monotonic`\
    \ behaves oddly in our containers and the TTL check is broken, and wants to switch to `time.time()`.\n\
    \nPlease work this as a hypothesis exercise. State each candidate root cause, the specific evidence\
    \ from the symptoms or code that confirms or rules it out, and a confidence ranking. Clearly separate\
    \ confirmed facts from inference. Then return the full corrected module in one ```python block.\n\n\
    ```python\nimport functools\nimport time\n\n\ndef memoize(ttl, clock=time.monotonic):\n    \"\"\"\
    Cache results of fn for `ttl` seconds.\"\"\"\n    def deco(fn):\n        cache = {}\n\n        @functools.wraps(fn)\n\
    \        def wrapper(*args, **kwargs):\n            key = args\n            now = clock()\n      \
    \      hit = cache.get(key)\n            if hit is not None and now - hit[0] < ttl:\n            \
    \    return hit[1]\n            value = fn(*args, **kwargs)\n            cache[key] = (now, value)\n\
    \            return value\n\n        wrapper.cache = cache\n        return wrapper\n    return deco\n\
    \n\nRATES = {\"USD\": 1.0, \"EUR\": 0.92, \"GBP\": 0.79}\n\n\n@memoize(ttl=60)\ndef convert(amount,\
    \ currency=\"USD\"):\n    return round(amount * RATES[currency], 2)\n```"
  buggy_code: "import functools\nimport time\n\n\ndef memoize(ttl, clock=time.monotonic):\n    \"\"\"\
    Cache results of fn for `ttl` seconds.\"\"\"\n    def deco(fn):\n        cache = {}\n\n        @functools.wraps(fn)\n\
    \        def wrapper(*args, **kwargs):\n            key = args\n            now = clock()\n      \
    \      hit = cache.get(key)\n            if hit is not None and now - hit[0] < ttl:\n            \
    \    return hit[1]\n            value = fn(*args, **kwargs)\n            cache[key] = (now, value)\n\
    \            return value\n\n        wrapper.cache = cache\n        return wrapper\n    return deco\n\
    \n\nRATES = {\"USD\": 1.0, \"EUR\": 0.92, \"GBP\": 0.79}\n\n\n@memoize(ttl=60)\ndef convert(amount,\
    \ currency=\"USD\"):\n    return round(amount * RATES[currency], 2)\n"
  test_code: "from buggy import *\n\n\ndef test_kwargs_distinguish_cache_entries():\n    convert.cache.clear()\n\
    \    assert convert(100) == 100.0\n    assert convert(100, currency=\"EUR\") == 92.0\n    assert convert(100,\
    \ currency=\"GBP\") == 79.0\n\n\ndef test_custom_function_kwargs():\n    t = [0.0]\n    calls = []\n\
    \n    @memoize(ttl=10, clock=lambda: t[0])\n    def scale(x, factor=1):\n        calls.append((x,\
    \ factor))\n        return x * factor\n\n    assert scale(2, factor=3) == 6\n    assert scale(2, factor=5)\
    \ == 10\n    assert len(calls) == 2\n\n\ndef test_ttl_hit_and_expiry():\n    t = [0.0]\n    calls\
    \ = []\n\n    @memoize(ttl=10, clock=lambda: t[0])\n    def f(x):\n        calls.append(x)\n     \
    \   return x + 1\n\n    assert f(1) == 2\n    t[0] = 5.0\n    assert f(1) == 2\n    assert len(calls)\
    \ == 1\n    t[0] = 11.0\n    assert f(1) == 2\n    assert len(calls) == 2\n"
  reference_code: "import functools\nimport time\n\n\ndef memoize(ttl, clock=time.monotonic):\n    \"\"\
    \"Cache results of fn for `ttl` seconds.\"\"\"\n    def deco(fn):\n        cache = {}\n\n        @functools.wraps(fn)\n\
    \        def wrapper(*args, **kwargs):\n            key = (args, tuple(sorted(kwargs.items())))\n\
