    \ 0, 'last': 4, 'count': 2},\n {'sig': 'upstream connect error', 'first': 8, 'last': 12, 'count':\
    \ 2}]\n```\n\nExpected:\n\n```\n[{'sig': 'upstream connect error', 'first': 0, 'last': 12, 'count':\
    \ 4}]\n```\n\n```python\ndef collapse_bursts(events, window):\n    \"\"\"events: iterable of (t_seconds,\
    \ signature) in any order.\n    An event is folded into the open burst for its signature if it occurs\
    \ within\n    `window` seconds (inclusive) of the PREVIOUS occurrence of that signature.\n    Returns\
    \ a list of dicts {sig, first, last, count} ordered by burst start.\"\"\"\n    bursts = []\n    open_burst\
    \ = {}\n    for t, sig in sorted(events):\n        b = open_burst.get(sig)\n        if b is not None\
