- id: error_triage_prioritization_1
  type: verifiable
  title: Error fingerprinting splits one issue into thousands of groups
  prompt: "Our in-house error aggregator groups exceptions by a normalized \"fingerprint\" and ranks the\
    \ groups by how many distinct users they hit, then by event count. On-call uses this list to decide\
    \ what to look at first.\n\nSince we started putting order UUIDs in exception messages, the triage\
    \ list is useless. One bug that hit ~3,000 customers shows up as ~3,000 separate groups, each with\
    \ users=1 and count=1. Meanwhile a TimeoutError hitting a single internal user sits at the top. Segfault\
    \ groups also never merge: every memory address gets its own group.\n\nExample from the dashboard:\n\
    ```\nOrderNotFound:order <n>f<n>a<n>c<n>e-<n>b<n>-<n>d<n>-<n>a<n>e-<n>c<n>b<n>d<n>e<n>f<n> not found\
    \   users=1 count=1\nOrderNotFound:order <n>b<n>d<n>e<n>f-<n>-<n>abc-<n>def-<n>ab not found      \
    \                       users=1 count=1\nSegfault:invalid read at <n>x<n>ffe<n>ab in worker <n>  \
    \                                             users=1 count=1\n```\nExpected: `OrderNotFound:order\
    \ <uuid> not found` and `Segfault:invalid read at <hex> in worker <n>`.\n\n```python\nimport re\n\n\
    _HEX = re.compile(r\"0x[0-9a-fA-F]+\")\n_UUID = re.compile(r\"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\"\
    )\n_NUM = re.compile(r\"\\d+\")\n\n\ndef fingerprint(exc_type, message):\n    \"\"\"Normalize volatile\
    \ tokens so equivalent errors share a fingerprint.\"\"\"\n    msg = _NUM.sub(\"<n>\", message)\n \
    \   msg = _UUID.sub(\"<uuid>\", msg)\n    msg = _HEX.sub(\"<hex>\", msg)\n    return f\"{exc_type}:{msg}\"\
    \n\n\ndef group_errors(events):\n    \"\"\"events: dicts with keys type, message, user_id.\n    Returns\
    \ groups sorted by distinct users desc, then count desc, then fingerprint.\"\"\"\n    groups = {}\n\
    \    for e in events:\n        fp = fingerprint(e[\"type\"], e[\"message\"])\n        g = groups.setdefault(fp,\
    \ {\"fingerprint\": fp, \"count\": 0, \"users\": set()})\n        g[\"count\"] += 1\n        g[\"\
