- id: hypothesis_testing_4
  type: rubric
  title: 'orders-api latency incident: deploy blamed, but the evidence points to a config change'
  prompt: 'We had a SEV-2 yesterday. orders-api p99 latency went from about 210 ms to about 31 s. The
    incident channel immediately blamed the 14:10 deploy of v2.14.0 and rolled it back. I need the root-cause
    analysis section of the postmortem. List your hypotheses and rank them by confidence. For each one,
    cite the specific log or metric lines that support or contradict it, and clearly separate what is
    confirmed from what is inferred. Also tell me what additional check would settle any remaining uncertainty.


    Timeline (UTC, all from our observability stack):

    ```

    13:58:00 config-service  change CHG-4471 pushed by dba-team: orders-api db.pool.max_size 50 -> 10
    (note: "right-size pools before DB failover test")

    14:00:04 orders-api      INFO  HikariPool-1 config reloaded: maximumPoolSize=10

    14:01:30 metrics         orders-api p99=230ms  rps=410

    14:02:11 orders-api      WARN  HikariPool-1 - Connection is not available, request timed out after
    30000ms (total=10, active=10, idle=0, waiting=37)

    14:03:00 metrics         orders-api p99=31,200ms  rps=405  5xx=6.1%

    14:05:12 orders-api      INFO  GC pause (G1 Young) 44ms

    14:06:40 orders-api      WARN  HikariPool-1 - Connection is not available ... (total=10, active=10,
    idle=0, waiting=58)

    14:10:00 deploy          orders-api v2.14.0 rolled out (changes: new /orders/export endpoint behind
    flag export_enabled=false; dependency bump jackson 2.17.1->2.17.2)

    14:12:00 metrics         orders-db cpu=22%  active_connections=41 (baseline ~88)  slow_queries=0

    14:15:00 deploy          rollback orders-api v2.14.0 -> v2.13.3 complete

    14:17:00 metrics         orders-api p99=30,900ms  5xx=5.8%

    14:31:00 orders-api      WARN  HikariPool-1 - Connection is not available ... (total=10, active=10,
    idle=0, waiting=61)

    ```'
  buggy_code: ''
  test_code: ''
  reference_code: ''
  rubric:
  - 'Rules out the v2.14.0 deploy as root cause, citing at least one timing fact: the WARN at 14:02:11
    and p99 = 31,200 ms at 14:03 come before the 14:10 deploy, and/or p99 stays about 30.9 s after the
    14:15 rollback. It also notes the new endpoint was flag-disabled.'
  - Names the CHG-4471 pool reduction (max_size 50 -> 10) as the top-ranked hypothesis. Cites the 14:00:04
    reload line and the pool-exhaustion WARNs (active=10, idle=0, waiting=37/58/61) as supporting evidence.
  - Rules out or down-ranks database overload and GC as causes, citing orders-db cpu=22%, active_connections=41
    (below baseline), slow_queries=0, and the 44 ms GC pause.
  - Explicitly labels which statements are confirmed by the logs and which are inference. For example,
    it is inferred, not proven, that 10 connections cannot serve about 405 rps given per-request hold
    time.
  - Proposes a concrete discriminating check or remediation to confirm causation, such as restoring max_size
    to 50 and watching p99 and waiting count, or measuring connection hold time × rps against pool size.
  expected_behaviour: ''
  variant_of: ''
  capability: hypothesis_testing
  validation:
    valid: true
    reasons: []
