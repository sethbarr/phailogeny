    \  meta = {\"source\": \"web\", \"currency\": currency, \"customer_id\": customer_id}\n22     return\
    \ repo.insert_order(amount_cents=amount_cents, meta=json.dumps(meta))\n...\n30 def load(order_id):\n\
    31     row = repo.fetch_order(order_id)\n32     if row is None:\n33         abort(404)\n34     return\
    \ _hydrate(row)\n...\n41 def _hydrate(row):\n42     meta = json.loads(row[\"meta\"] or \"{}\")\n43\
