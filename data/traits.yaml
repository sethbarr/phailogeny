# Trait taxonomy for declared-function comparison, v1.
# Each trait lists lowercase phrases. Matching is on whole tokens after light normalisation
# (punctuation other than + # . stripped, trailing periods dropped), so "c++", "c#", ".net" work.
# The agent's own name is never searched, so twins cannot match on name alone.
